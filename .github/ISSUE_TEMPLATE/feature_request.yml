name: Feature Request
description: Propose a new feature for the project.
title: "[Feature Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Specification
        Please provide the details required for the development team to begin work.
  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: Add implementation details for the feature request. Enumerate the list of features for this user story, what it should do and how it should behave. Use the following format:
      value: |
        Within <CLIVE/FLAME>, it must be possible for the <module> to perform <action> in order to <achieve goal>. The feature should be implemented in a way that <describe behavior>.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria (AC)
      description: The acceptance criteria is the user story in checklist format, this defines the conditions that must be met for the feature to be considered complete. Use the following format:
      value: |
        - [ ] Requirement 1
        - [ ] Requirement 2
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter
      description: Add which chapter/subchapter in the paper this feature request is related to. If it requires multiple subchapters, it is best to create a separate feature request for each subchapter.
      placeholder: Enter the chapter/subchapter number (e.g., 1.1, 2.3, etc.)
    validations:
      required: false