name: Bug Report (QA)
description: Report a defect found during verification or in production.
title: "[Bug Report]"
labels: ["qa-failed"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Details
        Provide a clear and concise description of the defect.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug?
      placeholder: A brief summary of the issue.
    validations:
      required: true
  - type: input
    id: commit-hash
    attributes:
      label: Source Commit
      description: The commit hash where the bug was found (if applicable).
      placeholder: e.g., a1b2c3d
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we see this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs Actual Behavior
      description: What should have happened vs what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser build was this found on?
      options:
        - Chrome
        - Firefox
        - Both
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      description: The version shown on chrome://extensions or about:addons (if applicable).
      placeholder: e.g., 1.5.0
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste error logs (from the extension's DevTools console) or attach screenshots here.
